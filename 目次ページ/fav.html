<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>お気に入り - 実用Webツール集</title>
  <meta name="description" content="お気に入りに登録したWebツールの一覧。">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root{
      --indigo:#4f46e5; --violet:#7c3aed; --sky:#0284c7;
      --text:#0f172a; --muted:#64748b;
      --bg:#f6f7fb; --card:#ffffff; --border:#e6e8f0;
      --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px -12px rgba(15,23,42,.12);
      --shadow-hover:0 2px 4px rgba(15,23,42,.06),0 16px 32px -12px rgba(79,70,229,.25);
      --radius:18px;
      --tint:#eef2ff;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --text:#e2e8f0; --muted:#94a3b8;
        --bg:#0b1120; --card:#131c31; --border:#22304d;
        --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
        --shadow-hover:0 2px 4px rgba(0,0,0,.5),0 16px 32px -12px rgba(124,58,237,.45);
        --tint:#1e2547;
      }
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
      background:var(--bg); color:var(--text); line-height:1.75;
      letter-spacing:.02em; line-break:strict; overflow-wrap:break-word;
      padding-bottom:96px;
    }
    .container{max-width:1024px;margin:0 auto;padding:0 16px}

    /* ===== Hero ===== */
    .hero{padding:28px 0 6px}
    .hero-inner{max-width:1024px;margin:0 auto;padding:0 16px}
    h1{font-size:clamp(1.5rem,5.5vw,2rem);font-weight:900;letter-spacing:-.01em;line-height:1.4;text-wrap:balance}
    .subtitle{font-size:.88rem;color:var(--muted);margin-top:8px;line-height:1.8;text-wrap:pretty}
    .subtitle .phrase{display:inline-block}

    /* ===== Sticky search + tabs ===== */
    .stickybar{
      position:sticky;top:0;z-index:20;
      background:color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid var(--border);
      padding:10px 0 8px;margin-bottom:18px;
    }
    .search-wrap{position:relative;max-width:1024px;margin:0 auto;padding:0 16px}
    .search-wrap .icon{
      position:absolute;left:30px;top:50%;transform:translateY(-50%);
      font-size:1rem;pointer-events:none;opacity:.55;
    }
    #searchInput{
      width:100%;height:52px;border-radius:16px;
      border:1.5px solid var(--border);background:var(--card);color:var(--text);
      font-size:1rem;padding:0 44px 0 46px;outline:none;
      box-shadow:var(--shadow);transition:border-color .2s, box-shadow .2s;
      appearance:none;-webkit-appearance:none;
    }
    #searchInput:focus{border-color:var(--indigo);box-shadow:0 0 0 4px rgba(79,70,229,.18)}
    #searchClear{
      position:absolute;right:24px;top:50%;transform:translateY(-50%);
      width:32px;height:32px;border:none;border-radius:50%;cursor:pointer;
      background:var(--tint);color:var(--muted);font-size:.95rem;display:none;
      align-items:center;justify-content:center;
    }
    .category-tabs{
      display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;
      max-width:1024px;margin:0 auto;scrollbar-width:none;
    }
    .category-tabs::-webkit-scrollbar{display:none}
    .tab-btn{
      flex-shrink:0;min-height:40px;
      background:var(--card);border:1.5px solid var(--border);border-radius:999px;
      padding:8px 16px;font-size:.83rem;font-weight:700;color:var(--muted);
      cursor:pointer;white-space:nowrap;transition:all .18s;font-family:inherit;
    }
    .tab-btn:active{transform:scale(.96)}
    .tab-btn.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}

    /* ===== Special banner ===== */
    .special{
      background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:18px;margin-bottom:22px;
    }
    .special h2{font-size:.95rem;font-weight:800;margin-bottom:6px;line-height:1.6}
    .special p{font-size:.82rem;color:var(--muted);margin-bottom:12px;line-height:1.75;text-wrap:pretty}
    .special-list{list-style:none;display:grid;gap:10px}
    @media(min-width:640px){.special-list{grid-template-columns:1fr 1fr}}
    .special-list a{
      display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;
      background:var(--tint);
      border:1.5px solid var(--border);border-radius:14px;padding:13px 14px;
      font-weight:800;font-size:.87rem;transition:transform .15s, box-shadow .15s;min-height:56px;
    }
    .special-list a:active{transform:scale(.98)}
    .special-list .desc{display:block;font-weight:500;font-size:.76rem;color:var(--muted);margin-top:3px;line-height:1.6;text-wrap:pretty}
    .special-list .ext{margin-left:auto;color:var(--indigo);flex-shrink:0}

    /* ===== Sections & cards ===== */
    .result-count{font-size:.8rem;color:var(--muted);margin:0 2px 12px;min-height:1.2em;line-height:1.6}
    .category-section{margin-bottom:28px}
    .category-section[hidden]{display:none}
    .section-title{
      font-size:1rem;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-left:2px;
      line-height:1.6;text-wrap:balance;
    }
    .section-title .count{
      font-size:.7rem;font-weight:800;color:var(--indigo);background:var(--tint);
      border-radius:999px;padding:2px 9px;
    }
    .tool-list{display:grid;gap:10px;grid-template-columns:1fr}
    @media(min-width:640px){.tool-list{grid-template-columns:1fr 1fr}}
    @media(min-width:960px){.tool-list{grid-template-columns:1fr 1fr 1fr}}
    .tool-card{
      position:relative;display:flex;align-items:flex-start;gap:14px;
      background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
      padding:16px 46px 16px 16px;text-decoration:none;color:inherit;
      box-shadow:var(--shadow);min-height:72px;
      transition:transform .15s, box-shadow .2s, border-color .2s;
    }
    .tool-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:rgba(99,102,241,.4)}
    .tool-card:active{transform:scale(.985)}
    .tool-card[hidden]{display:none}
    .tool-icon{
      width:48px;height:48px;flex-shrink:0;border-radius:14px;margin-top:2px;
      display:flex;align-items:center;justify-content:center;font-size:1.35rem;
      background:var(--tint);
    }
    [data-cat="media"] .tool-icon{background:linear-gradient(135deg,#ede9fe,#fae8ff)}
    [data-cat="money"] .tool-icon{background:linear-gradient(135deg,#fef3c7,#dcfce7)}
    [data-cat="time"] .tool-icon{background:linear-gradient(135deg,#dbeafe,#e0f2fe)}
    [data-cat="lifestyle"] .tool-icon{background:linear-gradient(135deg,#ccfbf1,#fef9c3)}
    [data-cat="utility"] .tool-icon{background:linear-gradient(135deg,#e0e7ff,#f1f5f9)}
    @media (prefers-color-scheme: dark){
      [data-cat="media"] .tool-icon,[data-cat="money"] .tool-icon,
      [data-cat="time"] .tool-icon,[data-cat="lifestyle"] .tool-icon,
      [data-cat="utility"] .tool-icon{background:var(--tint)}
    }
    .tool-info{flex:1;min-width:0}
    .tool-title{font-size:.93rem;font-weight:800;line-height:1.55;text-wrap:balance}
    .tool-desc{
      font-size:.78rem;color:var(--muted);margin-top:3px;line-height:1.7;
      text-wrap:pretty;
    }
    .arrow{display:none}
    @media (prefers-color-scheme: dark){.arrow{color:#3b4a68}}
    .fav-btn{
      position:absolute;top:6px;right:6px;width:34px;height:34px;
      border:none;background:transparent;cursor:pointer;font-size:1rem;line-height:1;
      color:#c3c9d6;border-radius:50%;display:flex;align-items:center;justify-content:center;
      transition:transform .15s,color .15s;z-index:2;
    }
    .fav-btn:active{transform:scale(1.3)}
    .fav-btn.on{color:#f59e0b}
    .empty{
      display:none;text-align:center;padding:44px 16px;color:var(--muted);line-height:1.9;
      background:var(--card);border:1.5px dashed var(--border);border-radius:var(--radius);
    }
    .empty .big{font-size:2rem;margin-bottom:8px}
    .empty.show{display:block}
    footer{
      margin-top:36px;text-align:center;font-size:.74rem;color:var(--muted);line-height:1.7;padding:0 16px;
    }
    footer .lock{font-weight:700;color:var(--text)}
  
    /* ===== Top bar & side drawer (v4) ===== */
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
      max-width:1024px;margin:0 auto;padding:14px 16px 0}
    .site-name{font-size:1.05rem;font-weight:900;color:inherit;text-decoration:none;line-height:1.4}
    .menu-btn{flex-shrink:0;min-width:52px;height:52px;border-radius:16px;cursor:pointer;
      border:1.5px solid var(--border);background:var(--card);color:var(--text);
      font-size:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
      box-shadow:var(--shadow);font-family:inherit}
    .menu-btn small{font-size:.58rem;font-weight:700;color:var(--muted);line-height:1}
    .menu-btn:active{transform:scale(.95)}
    .overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:40;
      opacity:0;pointer-events:none;transition:opacity .25s}
    .overlay.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;z-index:50;height:100dvh;width:min(320px,86vw);
      background:var(--card);box-shadow:-12px 0 32px rgba(15,23,42,.18);
      transform:translateX(105%);transition:transform .28s ease;overflow-y:auto;
      padding:16px 16px 32px}
    .drawer.open{transform:none}
    .drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .drawer-head .t{font-weight:900;font-size:1rem}
    .drawer-close{width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;
      background:var(--tint);color:var(--text);font-size:1rem}
    .nav-item{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
      padding:14px 12px;border-radius:14px;font-weight:800;font-size:.95rem;line-height:1.5;min-height:56px}
    .nav-item:active{background:var(--tint)}
    .nav-item.active{background:var(--tint);color:var(--indigo)}
    .nav-item .n-icon{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--tint);
      display:flex;align-items:center;justify-content:center;font-size:1.15rem}
    .nav-item.active .n-icon{background:var(--card)}
    .nav-item .n-count{margin-left:auto;font-size:.72rem;font-weight:800;color:var(--indigo);
      background:var(--tint);border-radius:999px;padding:2px 9px}
    .nav-item.active .n-count{background:var(--card)}
    .nav-sep{border:none;border-top:1px solid var(--border);margin:10px 0}
    body.locked{overflow:hidden}
    /* ===== Home: category cards ===== */
    .cat-list{display:grid;gap:10px;grid-template-columns:1fr;margin-top:6px}
    @media(min-width:640px){.cat-list{grid-template-columns:1fr 1fr}}
    .cat-card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
      background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);
      padding:18px 16px;box-shadow:var(--shadow);min-height:84px;transition:transform .15s, box-shadow .2s}
    .cat-card:active{transform:scale(.985)}
    .cat-card .c-icon{width:52px;height:52px;flex-shrink:0;border-radius:14px;background:var(--tint);
      display:flex;align-items:center;justify-content:center;font-size:1.5rem}
    .cat-card .c-title{font-weight:900;font-size:1rem;line-height:1.55}
    .cat-card .c-desc{display:block;font-size:.78rem;color:var(--muted);line-height:1.7;margin-top:2px;text-wrap:pretty}
    .cat-card .c-arrow{margin-left:auto;color:var(--muted);font-size:1.3rem;flex-shrink:0}
    .page-head{padding:10px 0 4px}
    .page-head h1{font-size:clamp(1.35rem,5vw,1.8rem)}
    .back-link{display:inline-flex;align-items:center;gap:6px;margin-top:22px;
      color:var(--indigo);font-weight:800;font-size:.88rem;text-decoration:none;min-height:44px}
    [data-cat="dev"] .tool-icon{background:linear-gradient(135deg,#e0e7ff,#cffafe)}
    @media (prefers-color-scheme: dark){[data-cat="dev"] .tool-icon{background:var(--tint)}}
</style>

    (function(){
      'use strict';

      var drawer = document.getElementById('drawer');
      var overlay = document.getElementById('drawerOverlay');
      var menuBtn = document.getElementById('menuBtn');
      function setDrawer(open){
        drawer.classList.toggle('open', open);
        overlay.classList.toggle('open', open);
        document.body.classList.toggle('locked', open);
        drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
        menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      menuBtn.addEventListener('click', function(){ setDrawer(true); });
      document.getElementById('drawerClose').addEventListener('click', function(){ setDrawer(false); });

      var FAV_KEY = 'portal-favs-v1';
      function loadFavs(){ try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch(e){ return []; } }
      function saveFavs(f){ try { localStorage.setItem(FAV_KEY, JSON.stringify(f)); } catch(e){} }
      var favs = loadFavs();

        });
