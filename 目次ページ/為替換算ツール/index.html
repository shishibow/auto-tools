<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>為替換算ツール - ドル・ユーロ・ポンドなどを円換算</title>
<meta name="description" content="金額と通貨を選ぶだけの為替換算。レートは自分で更新できるので、いつでも最新の目安で計算できます。">
<style>
:root{--primary:#4f46e5;--primary-light:#eef2ff;--primary-dark:#4338ca;--text:#0f172a;--text-muted:#64748b;--bg:#f6f7fb;--card-bg:#fff;--border:#e6e8f0;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);line-height:1.75;padding-bottom:90px}
.container{max-width:520px;margin:0 auto;padding:16px}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.site-nav a{text-decoration:none;font-weight:800;font-size:.85rem;color:var(--primary)}
.site-nav .sn-cat{color:var(--text-muted);font-weight:700;font-size:.8rem;text-align:right}
header{text-align:center;margin-bottom:20px;padding:12px 0 6px}
h1{font-size:1.4rem;font-weight:800;color:var(--primary)}
.subtitle{font-size:.8rem;color:var(--text-muted);margin-top:4px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;min-height:48px;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:1.1rem;min-width:0}
.input-row select{min-height:48px;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:1rem;font-weight:700}
.result{font-size:1.6rem;font-weight:800;color:var(--primary);text-align:center;padding:14px 0 4px;font-variant-numeric:tabular-nums}
.rate-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 2px;border-top:1px solid var(--border);font-size:.95rem}
.rate-row input{width:110px;min-height:44px;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:1rem;text-align:right}
.hint{font-size:.82rem;color:var(--text-muted);margin-top:12px}
.site-foot{margin-top:18px;text-align:center}
.site-foot a{color:var(--primary);font-weight:800;text-decoration:none;font-size:.85rem}
.site-foot .sf-note{display:block;color:var(--text-muted);font-size:.74rem;margin-top:2px}
</style>
</head>
<body>
<div class="container">
<nav class="site-nav"><a href="../">← 実用Webツール集</a><a class="sn-cat" href="../money.html">💰 お金・買い物の一覧</a></nav>
<header><h1>為替換算</h1><p class="subtitle">金額と通貨を選ぶだけ。レートは下の表で自由に更新できます</p></header>
<div class="card">
<label for="amount">金額</label>
<div class="input-row">
<input type="number" id="amount" value="100" step="any" inputmode="decimal">
<select id="fromCur"><option value="USD">米ドル</option><option value="EUR">ユーロ</option><option value="GBP">英ポンド</option><option value="AUD">豪ドル</option><option value="CAD">加ドル</option><option value="CNY">中国元</option><option value="KRW">韓国ウォン</option><option value="TWD">台湾ドル</option><option value="JPY" selected>日本円</option></select>
</div>
<label for="toCur" style="margin-top:14px">換算先</label>
<div class="input-row">
<select id="toCur"><option value="JPY" selected>日本円</option><option value="USD">米ドル</option><option value="EUR">ユーロ</option><option value="GBP">英ポンド</option><option value="AUD">豪ドル</option><option value="CAD">加ドル</option><option value="CNY">中国元</option><option value="KRW">韓国ウォン</option><option value="TWD">台湾ドル</option></select>
</div>
<div class="result" id="result">—</div>
<p class="hint">下のレート表（1通貨単位＝○円）を書き換えると、換算結果もすぐ変わります。初期値は目安です。実際の両替では手数料やスプレッドが加わります。</p>
</div>
<div class="card">
<label>レート表（1単位＝○円）</label>
<div id="rateList"></div>
</div>
<footer class="site-foot"><a href="../money.html">← お金・買い物のツール一覧へ</a><span class="sf-note">実用Webツール集</span></footer>
</div>
<!-- 忍者AdMax広告コード -->
<!-- admax -->
<script src="https://adm.shinobi.jp/s/834438d30cf5170af175302bc084e665"></script>
<!-- admax -->
<script>
var CURS=[['USD','米ドル',155],['EUR','ユーロ',180],['GBP','英ポンド',210],['AUD','豪ドル',100],['CAD','加ドル',110],['CNY','中国元',22],['KRW','韓国ウォン',0.11],['TWD','台湾ドル',5.0],['JPY','日本円',1]];
function rateOf(c){var el=document.getElementById('rate-'+c);if(el)return parseFloat(el.value)||0;return 1;}
function fmt(v){if(v>=1000000)return Math.round(v).toLocaleString();if(v>=100)return v.toLocaleString(undefined,{maximumFractionDigits:0});if(v>=1)return v.toLocaleString(undefined,{maximumFractionDigits:2});return v.toLocaleString(undefined,{maximumFractionDigits:4});}
function render(){
  var amt=parseFloat(document.getElementById('amount').value)||0;
  var from=document.getElementById('fromCur').value, to=document.getElementById('toCur').value;
  var jpy=amt*rateOf(from);
  var out=jpy/rateOf(to);
  document.getElementById('result').textContent=fmt(out)+' '+to;
}
document.getElementById('rateList').innerHTML=CURS.filter(function(c){return c[0]!=='JPY';}).map(function(c){
  return '<div class="rate-row"><span>1 '+c[1]+'（'+c[0]+'）</span><span><input type="number" id="rate-'+c[0]+'" value="'+c[2]+'" step="any" inputmode="decimal"> 円</span></div>';
}).join('');
['amount','fromCur','toCur'].forEach(function(id){document.getElementById(id).addEventListener('input',render);document.getElementById(id).addEventListener('change',render);});
CURS.forEach(function(c){var el=document.getElementById('rate-'+c[0]);if(el)el.addEventListener('input',render);});
render();
</script>
</body>
</html>
