<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>速度単位換算ツール - km/h・m/s・mph・ノットを相互換算</title>
<meta name="description" content="速度の数値と単位を入れるだけ。km/h・m/s・マイル毎時・ノットに一気に換算できます。">
<style>
:root{--primary:#4f46e5;--primary-light:#eef2ff;--primary-dark:#4338ca;--text:#0f172a;--text-muted:#64748b;--bg:#f6f7fb;--card-bg:#fff;--border:#e6e8f0;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);line-height:1.75;padding-bottom:90px}
.container{max-width:520px;margin:0 auto;padding:16px}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.site-nav a{text-decoration:none;font-weight:800;font-size:.85rem;color:var(--primary)}
.site-nav .sn-cat{color:var(--text-muted);font-weight:700;font-size:.8rem;text-align:right}
header{text-align:center;margin-bottom:20px;padding:12px 0 6px}
h1{font-size:1.4rem;font-weight:800;color:var(--primary)}
.subtitle{font-size:.8rem;color:var(--text-muted);margin-top:4px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.input-row{display:flex;gap:8px}
.input-row input{flex:1;min-height:48px;border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;font-size:1.1rem;min-width:0}
.input-row select{min-height:48px;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:1rem;font-weight:700}
.result-item{display:flex;justify-content:space-between;gap:10px;padding:12px 2px;border-top:1px solid var(--border);font-size:1rem}
.result-item:first-child{border-top:none}
.result-item .unit-name{font-weight:700}
.result-item .unit-val{font-variant-numeric:tabular-nums}
.hint{font-size:.82rem;color:var(--text-muted);margin-top:12px}
.site-foot{margin-top:18px;text-align:center}
.site-foot a{color:var(--primary);font-weight:800;text-decoration:none;font-size:.85rem}
.site-foot .sf-note{display:block;color:var(--text-muted);font-size:.74rem;margin-top:2px}
</style>
</head>
<body>
<div class="container">
<nav class="site-nav"><a href="../">← 実用Webツール集</a><a class="sn-cat" href="../utility.html">🛠️ テキスト・便利機能の一覧</a></nav>
<header><h1>速度単位換算</h1><p class="subtitle">数値と単位を入れれば、全部の速度単位に換算されます</p></header>
<div class="card">
<label for="inputVal">数値と単位</label>
<div class="input-row">
<input type="number" id="inputVal" value="60" step="any" inputmode="decimal">
<select id="inputUnit"><option value="km/h" selected>km/h</option><option value="m/s">m/s</option><option value="mph">mph</option><option value="ノット">ノット</option></select>
</div>
<div id="resultList"></div>
<p class="hint">1ノット＝1.852km/h、1mph＝1.609344km/h、1m/s＝3.6km/hで計算しています。</p>
</div>
<footer class="site-foot"><a href="../utility.html">← テキスト・便利機能のツール一覧へ</a><span class="sf-note">実用Webツール集</span></footer>
</div>
<!-- 忍者AdMax広告コード -->
<!-- admax -->
<script src="https://adm.shinobi.jp/s/834438d30cf5170af175302bc084e665"></script>
<!-- admax -->
<script>
var UNITS=[['km/h',1],['m/s',3.6],['mph',1.609344],['ノット',1.852]];
function fmt(v){if(v===0)return '0';if(v>=1000||(v<0.01&&v>0))return v.toPrecision(5);return String(parseFloat(v.toFixed(4)));}
function render(){
  var val=parseFloat(document.getElementById('inputVal').value)||0;
  var unit=document.getElementById('inputUnit').value;
  var base=UNITS.filter(function(u){return u[0]===unit;})[0][1];
  var kmh=val*base;
  document.getElementById('resultList').innerHTML=UNITS.map(function(u){
    return '<div class="result-item"><span class="unit-name">'+u[0]+'</span><span class="unit-val">'+fmt(kmh/u[1])+'</span></div>';
  }).join('');
}
document.getElementById('inputVal').addEventListener('input',render);
document.getElementById('inputUnit').addEventListener('change',render);
render();
</script>
</body>
</html>
