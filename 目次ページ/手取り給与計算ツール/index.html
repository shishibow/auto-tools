<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手取り給与計算ツール - 月給から手取り額を概算</title>
<meta name="description" content="額面の月給とボーナスから、社会保険料と税金を引いた毎月の手取り額を概算します。転職・昇給の目安に。">
<style>
:root{--primary:#4f46e5;--primary-light:#eef2ff;--primary-dark:#4338ca;--text:#0f172a;--text-muted:#64748b;--bg:#f6f7fb;--card-bg:#fff;--border:#e6e8f0;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);line-height:1.75;padding-bottom:90px}
.container{max-width:520px;margin:0 auto;padding:16px}
.site-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.site-nav a{text-decoration:none;font-weight:800;font-size:.85rem;color:var(--primary)}
.site-nav .sn-cat{color:var(--text-muted);font-weight:700;font-size:.8rem;text-align:right}
header{text-align:center;margin-bottom:20px;padding:12px 0 6px}
h1{font-size:1.4rem;font-weight:800;color:var(--primary)}
.subtitle{font-size:.8rem;color:var(--text-muted);margin-top:4px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.slider-row{margin-bottom:16px}
.slider-row label{display:flex;justify-content:space-between;font-size:.9rem;font-weight:800}
.slider-row label span{color:var(--primary);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:48px;accent-color:var(--primary)}
.net-box{text-align:center;padding:8px 0 4px}
.net-box .lbl{font-size:.85rem;font-weight:800;color:var(--text-muted)}
.net-box .val{font-size:2.6rem;font-weight:900;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.2}
.net-box .val small{font-size:1.1rem}
.net-box .sub{font-size:.85rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px}
th,td{padding:8px 2px;border-bottom:1px solid var(--border);text-align:left}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
th{color:var(--text-muted);font-weight:700}
.bar-row{display:flex;align-items:center;gap:8px;font-size:.8rem;margin-top:6px}
.bar-row .bl{width:86px;flex-shrink:0;font-weight:700;color:var(--text-muted)}
.bar-track{flex:1;height:14px;background:#eef2ff;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px}
.bar-val{width:74px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.hint{font-size:.82rem;color:var(--text-muted);margin-top:12px}
.hint b{color:var(--text)}
.site-foot{margin-top:18px;text-align:center}
.site-foot a{color:var(--primary);font-weight:800;text-decoration:none;font-size:.85rem}
.site-foot .sf-note{display:block;color:var(--text-muted);font-size:.74rem;margin-top:2px}
</style>
</head>
<body>
<div class="container">
<nav class="site-nav"><a href="../">← 実用Webツール集</a><a class="sn-cat" href="../money.html">💰 お金・買い物の一覧</a></nav>
<header><h1>手取り給与計算ツール</h1><p class="subtitle">額面の月給から、社会保険料と税金を引いた手取り額を概算します</p></header>
<div class="card">
  <div class="slider-row">
    <label>額面の月給 <span id="salaryVal">300,000円</span></label>
    <input type="range" id="salaryRange" min="150000" max="600000" step="5000" value="300000">
  </div>
  <div class="slider-row">
    <label>ボーナス（年間） <span id="bonusVal">月給 0ヶ月分</span></label>
    <input type="range" id="bonusRange" min="0" max="6" step="0.5" value="0">
  </div>
  <div class="net-box">
    <div class="lbl">毎月の手取り額（概算）</div>
    <div class="val" id="netVal">—</div>
    <div class="sub" id="annualVal"></div>
  </div>
  <div id="barArea"></div>
  <table id="breakTable"></table>
  <p class="hint">健康保険 4.975%・厚生年金 9.15%・雇用保険 0.6%（いずれも本人負担分）、所得税は給与所得控除と基礎控除48万円を引いた課税所得から計算し、復興特別所得税 2.1% を加算、住民税は所得割 10%＋均等割 5,000円/年で概算しています。実際の金額は勤務先の条件や扶養家族の有無で変わります。<b>あくまで目安としてお使いください。</b></p>
</div>
<footer class="site-foot"><a href="../money.html">← お金・買い物のツール一覧へ</a><span class="sf-note">実用Webツール集</span></footer>
</div>
<!-- 忍者AdMax広告コード -->
<!-- admax -->
<script src="https://adm.shinobi.jp/s/834438d30cf5170af175302bc084e665"></script>
<!-- admax -->
<script>
function salaryDeduction(y){
  if(y<=1625000)return 550000;
  if(y<=1800000)return y*0.4-100000;
  if(y<=3600000)return y*0.3+80000;
  if(y<=6600000)return y*0.2+440000;
  if(y<=8500000)return y*0.1+1100000;
  return 1950000;
}
function incomeTaxYearly(taxable){
  var brackets=[[1950000,0.05,0],[3300000,0.10,97500],[6950000,0.20,427500],[9000000,0.23,636000],[18000000,0.33,1536000],[40000000,0.40,2796000],[Infinity,0.45,4796000]];
  for(var i=0;i<brackets.length;i++){
    if(taxable<=brackets[i][0])return Math.max(0,taxable*brackets[i][1]-brackets[i][2]);
  }
  return 0;
}
function calcTakeHome(monthly,bonusMonths){
  var grossAnnual=monthly*12+monthly*bonusMonths;
  var socialMonthly=Math.round(monthly*0.04975+monthly*0.0915+monthly*0.006);
  var health=Math.round(monthly*0.04975),pension=Math.round(monthly*0.0915),employment=Math.round(monthly*0.006);
  var socialAnnual=socialMonthly*12;
  var ded=salaryDeduction(grossAnnual);
  var taxableIncome=Math.max(0,grossAnnual-ded-socialAnnual-480000);
  var incomeTaxMonthly=Math.round(incomeTaxYearly(taxableIncome)*1.021/12);
  var taxableResident=Math.max(0,grossAnnual-ded-socialAnnual-430000);
  var residentMonthly=Math.round((taxableResident*0.10+5000)/12);
  var net=monthly-socialMonthly-incomeTaxMonthly-residentMonthly;
  return {grossMonthly:monthly,grossAnnual:grossAnnual,health:health,pension:pension,employment:employment,
    socialMonthly:socialMonthly,incomeTaxMonthly:incomeTaxMonthly,residentMonthly:residentMonthly,
    net:net,taxableIncome:taxableIncome};
}
function fmt(n){return n.toLocaleString('ja-JP')+'円';}
var salaryRange=document.getElementById('salaryRange'),bonusRange=document.getElementById('bonusRange'),
salaryVal=document.getElementById('salaryVal'),bonusVal=document.getElementById('bonusVal'),
netVal=document.getElementById('netVal'),annualVal=document.getElementById('annualVal'),
breakTable=document.getElementById('breakTable'),barArea=document.getElementById('barArea');
function render(){
  var monthly=+salaryRange.value,bonus=+bonusRange.value;
  salaryVal.textContent=fmt(monthly);
  bonusVal.textContent='月給 '+bonus+'ヶ月分'+(bonus>0?'（年 '+(monthly*bonus).toLocaleString('ja-JP')+'円）':'');
  var r=calcTakeHome(monthly,bonus);
  netVal.innerHTML=r.net.toLocaleString('ja-JP')+'<small> 円</small>';
  annualVal.textContent='年収 '+r.grossAnnual.toLocaleString('ja-JP')+'円（ボーナス込）・手取り率 '+Math.round(r.net/monthly*100)+'%';
  breakTable.innerHTML=
    '<tr><th>額面月給</th><td>'+fmt(monthly)+'</td></tr>'+
    '<tr><th>健康保険料</th><td>− '+fmt(r.health)+'</td></tr>'+
    '<tr><th>厚生年金保険料</th><td>− '+fmt(r.pension)+'</td></tr>'+
    '<tr><th>雇用保険料</th><td>− '+fmt(r.employment)+'</td></tr>'+
    '<tr><th>所得税（概算）</th><td>− '+fmt(r.incomeTaxMonthly)+'</td></tr>'+
    '<tr><th>住民税（概算）</th><td>− '+fmt(r.residentMonthly)+'</td></tr>'+
    '<tr><th>手取り月給</th><td>'+fmt(r.net)+'</td></tr>';
  var parts=[
    ['手取り',r.net,'#4f46e5'],
    ['社会保険',r.socialMonthly,'#0284c7'],
    ['所得税',r.incomeTaxMonthly,'#dc2626'],
    ['住民税',r.residentMonthly,'#f59e0b']];
  barArea.innerHTML=parts.map(function(p){
    var pct=Math.max(1,Math.round(p[1]/monthly*100));
    return '<div class="bar-row"><div class="bl">'+p[0]+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+p[2]+'"></div></div><div class="bar-val">'+pct+'%</div></div>';
  }).join('');
}
salaryRange.addEventListener('input',render);
bonusRange.addEventListener('input',render);
render();
</script>
</body>
</html>
