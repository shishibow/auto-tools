<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webツール自動発注パネル</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    h2 {
      font-size: 1.2rem;
      color: #2563eb;
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 16px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2563eb;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.98);
    }
    #status {
      margin-top: 16px;
      font-size: 0.85rem;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🛠️ ツール自動発注パネル</h2>
    <div class="form-group">
      <label for="themeInput">作りたいツールのテーマ・キーワード</label>
      <input type="text" id="themeInput" placeholder="例: 奨学金返済シミュレーター">
    </div>
    <button onclick="sendOrder()">発注する（工場を動かす）</button>
    <div id="status"></div>
  </div>

  <script>
    function sendOrder() {
      const theme = document.getElementById('themeInput').value.trim();
      const statusDiv = id => document.getElementById('status');
      
      if (!theme) {
        alert('テーマを入力してください');
        return;
      }

      // ★ここにあなたのMakeのWebhook URLを貼り付けてください
      const webhookUrl = "【ここにMakeのWebhook URLを貼り付け】";

      document.getElementById('status').textContent = "送信中...";

      // Makeへデータを送信（URLエンコード付き）
      fetch(webhookUrl + "?theme=" + encodeURIComponent(theme))
        .then(response => {
          if (response.ok) {
            document.getElementById('status').textContent = "✅ 発注完了しました！数分後にGitHubを確認してください。";
            document.getElementById('themeInput').value = "";
          } else {
            document.getElementById('status').textContent = "❌ 送信に失敗しました。";
          }
        })
        .catch(error => {
          document.getElementById('status').textContent = "❌ エラーが発生しました。";
        });
    }
  </script>
</body>
</html>
